# MoRE (Mixture-of-Retrieval-Experts) 配置
# 门控网络、专家和训练相关参数

more:
  enabled: true
  mode: "learned"  # learned, theory, uniform

  # 门控网络配置
  gating:
    feature_dim: 3090      # query_dim(3072) + 18
    query_dim: 3072        # 查询嵌入维度
    n_experts: 4           # 专家数量
    hidden_dim: 256        # 隐藏层维度
    dropout: 0.1
    temperature: 1.0       # softmax 温度 (越低越 sparse)
    top_k: 0               # 0=dense gating, >0=sparse top-k gating

  # 专家配置
  experts:
    - name: "BM25"
      type: "bm25"
      params:
        k1: 1.5
        b: 0.75
    - name: "Dense"
      type: "dense"
      params: {}
    - name: "Entity"
      type: "entity"
      params: {}
    - name: "Image"
      type: "image"
      params: {}

  # 训练配置
  training:
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 15
    # 损失函数权重
    lambda_balance: 0.1     # 负载均衡损失权重
    lambda_spec: 0.01       # 专家化损失权重
    lambda_entropy: 0.05    # 熵正则化权重
    # 数据
    n_synthetic: 1000       # 合成训练样本数
    train_ratio: 0.8
    # 设备
    device: "cpu"

  # 理论模式配置
  theory:
    framework: "information_theory"  # information_theory, bayesian
    n_random_search: 10000           # 经验最优搜索的采样数

  # 检索配置
  retrieval:
    top_k: 10
    candidate_pool_size: 100
